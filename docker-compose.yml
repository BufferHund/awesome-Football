version: '3.8'

services:
  football-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: awesome-football
    restart: unless-stopped
    ports:
      - "2000:2000"
    volumes:
      # 挂载数据目录，使数据库持久化
      - football-data:/app/data
      - ./football.db:/app/football.db
    environment:
      - NODE_ENV=production
      - PORT=2000
      # SuperAuth配置（如果已部署SuperAuth，请取消注释并配置）
      - GATEWAY_URL=${GATEWAY_URL:-http://gateway:4000}
      - PORTAL_URL=${PORTAL_URL:-http://localhost}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:2000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - football-network

volumes:
  football-data:
    driver: local

networks:
  football-network:
    driver: bridge
  # 如果需要连接到SuperAuth网络，取消下面的注释
  # superauth-network:
  #   external: true
