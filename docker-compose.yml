version: '3.8'

services:
  football-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: awesome-football
    restart: unless-stopped
    ports:
      - "2000:2000"
    volumes:
      # 挂载数据目录，使数据库持久化
      - football-data:/app/data
      - ./football.db:/app/football.db
    environment:
      - NODE_ENV=production
      - PORT=2000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:2000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - football-network

volumes:
  football-data:
    driver: local

networks:
  football-network:
    driver: bridge
