<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awesome Football - Match Simulator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>⚽ Awesome Football</h1>
            <p class="subtitle">Live Match Simulator</p>
        </header>

        <main>
            <div class="scoreboard">
                <div class="team home-team">
                    <h2 id="home-team-name">Home Team</h2>
                    <div class="score" id="home-score">0</div>
                </div>
                <div class="vs">VS</div>
                <div class="team away-team">
                    <h2 id="away-team-name">Away Team</h2>
                    <div class="score" id="away-score">0</div>
                </div>
            </div>

            <div class="match-time">
                <h3>Match Time: <span id="match-time">0</span>'</h3>
                <div class="match-status" id="match-status">Ready to Start</div>
            </div>

            <div class="controls">
                <button id="start-match" class="btn btn-primary">Start Match</button>
                <button id="pause-match" class="btn btn-secondary" disabled>Pause</button>
                <button id="reset-match" class="btn btn-danger">Reset</button>
            </div>

            <div class="team-selection">
                <h3>Select Teams</h3>
                <div class="team-inputs">
                    <div class="input-group">
                        <label for="home-team-input">Home Team:</label>
                        <select id="home-team-input">
                            <option value="Manchester United">Manchester United</option>
                            <option value="Liverpool">Liverpool</option>
                            <option value="Barcelona">Barcelona</option>
                            <option value="Real Madrid">Real Madrid</option>
                            <option value="Bayern Munich">Bayern Munich</option>
                            <option value="Juventus">Juventus</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="away-team-input">Away Team:</label>
                        <select id="away-team-input">
                            <option value="Liverpool">Liverpool</option>
                            <option value="Manchester United">Manchester United</option>
                            <option value="Barcelona">Barcelona</option>
                            <option value="Real Madrid">Real Madrid</option>
                            <option value="Bayern Munich">Bayern Munich</option>
                            <option value="Juventus">Juventus</option>
                        </select>
                    </div>
                </div>
                <button id="set-teams" class="btn btn-secondary">Set Teams</button>
            </div>

            <div class="match-events">
                <h3>Match Events</h3>
                <div id="events-list" class="events-list">
                    <p class="no-events">No events yet. Start the match!</p>
                </div>
            </div>
        </main>

        <footer>
            <p>Built with ❤️ for Football Fans</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
